<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Document</title>
    <link rel="stylesheet" href="./src/style.css"/>
  </head>
  <body class="font-josefinSans bg-[var(--body-bg)] h-dvh">
    <div class="bg-[url('/images/bg-mobile-light.jpg')] bg-cover h-[200px] bg-no-repeat flex flex-col relative">    
      <div class="flex flex-col gap-4">
       <div class="flex justify-between px-8 items-center">
        <h1 class="text-white font-semibold text-4xl py-10 tracking-[10px]">TODO</h1> 
        <button id="switchThemeBtn" class="hover:cursor-pointer h-fit">
          
        </button>
     </div>
    <div class="bg-[var(--input-bg)] flex py-2 rounded-lg p-2 w-[90%] max-w-[600px] mx-auto items-center">
        <span class="w-[25px] h-[25px] rounded-full border-1 opacity-30 border-gray-500 mr-3"></span>
        <input type="text" placeholder="Create a new todo" class="w-full p-1 focus:outline-none placeholder:text-[var(--task-text)] text-[var(--task-text)]">
    </div>
      <div class="bg-[var(--tasks-bg)] w-[90%] mx-auto max-w-[600px] rounded-lg">
        <ul>
            <li class="flex justify-between px-5 py-4 border-b border-b-gray-500">
              <div class="flex gap-2 items-center">
                <input type="checkbox" name="" id="task" class="hidden peer">
                <label for="task" class="w-6 h-6 select-none rounded-full border border-gray-500 cursor-pointer flex items-center justify-center peer-checked:bg-gradient-to-br peer-checked:from-[#57ddff] peer-checked:to-[#c058f3] peer-checked:border-0">
                  <svg xmlns="http://www.w3.org/2000/svg" width="11" height="9" class="">
                    <path fill="none" stroke="#FFF" stroke-width="2" d="M1 4.304L3.696 7l6-6"/>
                  </svg>
                </label>
                <span class="text-[var(--task-text)]">Finish JavaScript Course</span>
              </div>
              <button class="hover:cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"><path fill="#494C6B" fill-rule="evenodd" d="M16.97 0l.708.707L9.546 8.84l8.132 8.132-.707.707-8.132-8.132-8.132 8.132L0 16.97l8.132-8.132L0 .707.707 0 8.84 8.132 16.971 0z"/></svg>
              </button>
            </li>
        </ul>  
          <div class="p-5 flex justify-between">
            <p class="text-[var(--task-text)]" id="tasksCounter">Items Left 3</p>
            <button class="text-[var(--task-text)] cursor-pointer">Clear Completed</button>
          </div>
        </div>
        <div class="bg-[var(--tasks-bg)] max-w-[600px] w-[90%] mx-auto flex justify-around p-4">
            <button class="text-[var(--task-text)] active cursor-pointer">All</button>
            <button class="text-[var(--task-text)] cursor-pointer">Active</button>
            <button class="text-[var(--task-text)] cursor-pointer">Completed</button>
        </div>
      </div>
      <p class="text-lg mt-10 mx-auto text-gray-500">Drag and drop to reorder the list</p>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
